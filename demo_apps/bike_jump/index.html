<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自転車で走る！</title>

<style>
  body {
    margin: 0;
    background: #eef2f7;
    font-family: system-ui, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .game-container {
    text-align: center;
  }

  canvas {
    background: linear-gradient(#dff3ff, #ffffff);
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    display: block;
    margin: 0 auto;
  }

  button {
    margin-top: 12px;
    padding: 10px 20px;
    font-size: 15px;
    border-radius: 999px;
    border: none;
    background: #3072e6;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
  }

  button:hover {
    background: #295ec8;
  }

  .hint {
    margin-top: 8px;
    font-size: 14px;
    color: #555;
  }
</style>
</head>

<body>

<div class="game-container">
  <canvas id="game" width="480" height="280"></canvas>
  <button id="restartBtn" style="display:none;">リスタート</button>
  <div class="hint">SPACE / タップでジャンプ</div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const restartBtn = document.getElementById("restartBtn");

const W = canvas.width;
const H = canvas.height;

const bikeImg = new Image();
bikeImg.src = "bike.png";

const jumpSound = new Audio("jump.mp3");
jumpSound.volume = 0.6;

const hitSound = new Audio("hit.mp3");
hitSound.volume = 0.7;

// ===== プレイヤー =====
const player = {
  x: 60,
  y: 0,
  w: 28,
  h: 40,
  vy: 0,
  onGround: false
};

const GROUND_Y = H - 40;

// ===== 物理 =====
const GRAVITY = 0.8;
const JUMP = -12;

// ===== 障害物 =====
let obstacles = [];
const OB_W = 24;
const OB_H = 36;
let speed = 4;
let frame = 0;

// ===== 状態 =====
let running = false;
let gameOverFlag = false;
let score = 0;

// ===== 入力 =====
function jump() {
  if (!running || gameOverFlag) return;
  if (!player.onGround) return;

  player.vy = JUMP;
  player.onGround = false;

  jumpSound.currentTime = 0;
  jumpSound.play();
}

window.addEventListener("keydown", e => {
  if (e.code === "Space") {
    e.preventDefault();
    jump();
  }
});

canvas.addEventListener("click", jump);
canvas.addEventListener("touchstart", jump);

// ===== 開始 =====
function startGame() {
  running = true;
  gameOverFlag = false;
  restartBtn.style.display = "none";

  player.y = GROUND_Y - player.h;
  player.vy = 0;
  player.onGround = true;

  obstacles = [];
  speed = 4;
  frame = 0;
  score = 0;
}

// ===== 障害物生成 =====
function spawnObstacle() {
  obstacles.push({
    x: W,
    y: GROUND_Y - OB_H
  });
}

// ===== 当たり判定 =====
function hit(a, b) {
  return (
    a.x < b.x + OB_W &&
    a.x + a.w > b.x &&
    a.y < b.y + OB_H &&
    a.y + a.h > b.y
  );
}

// ===== 更新 =====
function update() {
  if (!running) return;

  // プレイヤー
  player.vy += GRAVITY;
  player.y += player.vy;

  if (player.y >= GROUND_Y - player.h) {
    player.y = GROUND_Y - player.h;
    player.vy = 0;
    player.onGround = true;
  }

  // 障害物
  if (frame % 90 === 0) spawnObstacle();

  for (const o of obstacles) {
    o.x -= speed;
    if (hit(player, o)) gameOver();
  }

  obstacles = obstacles.filter(o => o.x + OB_W > 0);

  // スコア & 難易度
  frame++;
  score = Math.floor(frame / 6);
  speed = 4 + frame / 1200;
}

// ===== 描画 =====
function draw() {
  ctx.clearRect(0, 0, W, H);

  // 地面
  ctx.fillStyle = "#999";
  ctx.fillRect(0, GROUND_Y, W, 2);

  // プレイヤー
  ctx.drawImage(bikeImg, player.x, player.y, player.w, player.h);

  // 障害物
  ctx.fillStyle = "#333";
  for (const o of obstacles) {
    ctx.fillRect(o.x, o.y, OB_W, OB_H);
  }

  // スコア
  ctx.fillStyle = "#000";
  ctx.font = "16px system-ui";
  ctx.fillText(`距離 ${score} m`, 10, 20);

  if (!running) {
    ctx.font = "bold 22px system-ui";
    ctx.fillText("START", W/2 - 35, H/2);
  }
}

// ===== GAME OVER =====
function gameOver() {
  running = false;
  gameOverFlag = true;

  hitSound.currentTime = 0;
  hitSound.play();

  restartBtn.style.display = "inline-block";
}

// ===== ループ =====
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

restartBtn.addEventListener("click", startGame);

// 初期表示
startGame();
loop();
</script>

</body>
</html>
