<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chari Run</title>

  <style>
    body {
      margin: 0;
      background: #eef2f7;
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .game {
      text-align: center;
    }

    canvas {
      background: linear-gradient(#dff3ff, #ffffff);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    button {
      margin-top: 12px;
      padding: 10px 20px;
      border-radius: 999px;
      border: none;
      background: #3072e6;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="game">
    <canvas id="cv" width="480" height="260"></canvas>
    <div>
      タップ / Spaceでジャンプ！
    </div>
    <button id="restart" style="display:none;">リスタート</button>
  </div>

  <script>
    const canvas = document.getElementById("cv");
    const ctx = canvas.getContext("2d");
    const restartBtn = document.getElementById("restart");

    const W = canvas.width;
    const H = canvas.height;

    let holeCount = 0;       // 残り穴ブロック数
    let safeCount = 2;      // 次に穴を出していいまでの地面数

    // ===== 画像・音 =====
    const bikeImg = new Image();
    bikeImg.src = "bike.png";

    const jumpSound = new Audio("jump.mp3");
    jumpSound.volume = 0.6;

    const hitSound = new Audio("hit.mp3");
    hitSound.volume = 0.7;

    // ===== プレイヤー =====
    const player = {
      x: 80,
      y: 0,
      w: 0,
      h: 0,
      vy: 0,
      onGround: false
    };

    bikeImg.onload = () => {
      const scale = 0.16;
      player.w = bikeImg.width * scale;
      player.h = bikeImg.height * scale;
      player.y = H - 60 - player.h;
    };

    // ===== 物理 =====
    const GRAVITY = 0.9;
    const JUMP = -16;

    // ===== 地面 =====
    const GROUND_H = 20;
    const BLOCK_W = 100;
    let ground = [];
    let speed = 4;
    let frame = 0;

    // ===== 状態 =====
    let running = false;
    let gameOverFlag = false;
    let score = 0;

    // ===== 入力 =====
    function jump() {
      if (!running || gameOverFlag) return;
      if (!player.onGround) return;

      player.vy = JUMP;
      player.onGround = false;

      jumpSound.currentTime = 0;
      jumpSound.play();
    }

    window.addEventListener("keydown", e => {
      if (e.code === "Space") {
        e.preventDefault();
        jump();
      }
    });
    canvas.addEventListener("click", jump);
    canvas.addEventListener("touchstart", jump);

    // ===== 地面生成 =====
    function addGround() {
      const last = ground[ground.length - 1];
      const x = last ? last.x + BLOCK_W : 0;

      const baseY = H - 40;
      const offset = Math.random() * 30 - 15;
      const y = baseY + offset;

      let isHole = false;

      if (holeCount > 0) {
        // 穴の続き
        isHole = true;
        holeCount--;
      } else if (safeCount > 0) {
        // 安全地帯を強制
        isHole = false;
        safeCount--;
      } else if (Math.random() < 0.15) {
        // 新しい穴を開始（最大2ブロック）
        isHole = true;
        holeCount = Math.random() < 0.5 ? 0 : 1; // 合計1〜2ブロック
        safeCount = 1; // 次は必ず地面
      }

      ground.push({ x, y, hole: isHole });
    }

    // ===== ゲーム開始 =====
    function startGame() {
      running = true;
      gameOverFlag = false;
      restartBtn.style.display = "none";

      player.vy = 0;
      ground = [];
      frame = 0;
      score = 0;

       // ★ 必ず初期位置に戻す
      player.y = H - 60 - player.h;

      // 初期地面
      for (let i = 0; i < W / BLOCK_W + 2; i++) {
        addGround();
      }
    }

    // ===== 更新 =====
    function update() {
      if (!running) return;

      frame++;
      speed = 4 + frame / 1500;
      score = Math.floor(frame / 10);

      // 地面移動
      for (const g of ground) {
        g.x -= speed;
      }

      // 左を削除
      if (ground[0].x + BLOCK_W < 0) {
        ground.shift();
        addGround();
      }

      // 重力
      player.vy += GRAVITY;
      player.y += player.vy;
      player.onGround = false;

      // 着地判定
      for (const g of ground) {
        if (g.hole) continue;

        const onX =
          player.x + player.w > g.x &&
          player.x < g.x + BLOCK_W;

        const onY =
          player.y + player.h >= g.y &&
          player.y + player.h <= g.y + 20 &&
          player.vy >= 0;

        if (onX && onY) {
          player.y = g.y - player.h;
          player.vy = 0;
          player.onGround = true;
          break;
        }
      }

      // 落下アウト
      if (player.y > H) {
        gameOver();
      }
    }

    // ===== 描画 =====
    function draw() {
      ctx.clearRect(0, 0, W, H);

      // 地面
      for (const g of ground) {
        if (g.hole) continue;

        ctx.fillStyle = "#666";
        ctx.fillRect(g.x, g.y, BLOCK_W, GROUND_H);
      }

      // プレイヤー
      ctx.drawImage(bikeImg, player.x, player.y, player.w, player.h);

      // スコア
      ctx.fillStyle = "#000";
      ctx.font = "16px system-ui";
      ctx.fillText(`距離 ${score} m`, 10, 20);

      if (!running) {
        ctx.font = "bold 22px system-ui";
        ctx.fillText("Game Over", W / 2 - 60, H / 2);
      }
    }

    // ===== GAME OVER =====
    function gameOver() {
      running = false;
      gameOverFlag = true;

      hitSound.currentTime = 0;
      hitSound.play();

      restartBtn.style.display = "block";
    }

    // ===== ループ =====
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    restartBtn.addEventListener("click", startGame);

    // 初期起動
    startGame();
    loop();
  </script>

</body>

</html>
