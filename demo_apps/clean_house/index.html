<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cleaner Game</title>

  <style>
    body {
      margin: 0;
      background: #f4f4f4;
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .game {
      text-align: center;
    }

    canvas {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      touch-action: none;
      /* ★ スクロール防止 */
    }

    .msg {
      margin-top: 10px;
      font-weight: bold;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px;
      width: 260px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }

    .modal-box h2 {
      margin-top: 0;
      margin-bottom: 12px;
    }

    .modal-box p {
      margin-bottom: 20px;
    }

    .modal-box button {
      padding: 10px 24px;
      border-radius: 999px;
      border: none;
      background: #3072e6;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    .modal-box button:hover {
      background: #295ec8;
    }

    .game-wrap {
      position: relative;          /* ★ absolute の基準 */
      display: flex;
      justify-content: center;     /* ★ canvas を常に中央 */
      align-items: center;
    }

    /* サイドキャラ */
    .side-character img {
      width: 160px;
      position: absolute;
      right: -180px;               /* ★ canvas の右外に配置（調整可） */
      top: 50%;
      transform: translateY(-50%);
    }

    /* スマホでは非表示 */
    @media (max-width: 768px) {
      .side-character {
        display: none;
      }

      .game-wrap {
        justify-content: center;
      }
    }
  </style>
</head>

<body>

<div class="game-wrap">
  <div class="side-character">
    <img id="womanImg" src="lady1.png" alt="woman">
  </div>

  <div class="game">
    <canvas id="cv" width="360" height="540"></canvas>
    <div class="msg" id="msg">ゴミを全部吸い取ろう！</div>
  </div>
</div>

  <div id="modal" class="modal">
    <div class="modal-box">
      <h2>🎉 おそうじ完了！</h2>
      <button id="restartBtn">もう一度</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("cv");
    const ctx = canvas.getContext("2d");
    const msg = document.getElementById("msg");
    const modal = document.getElementById("modal");
    const restartBtn = document.getElementById("restartBtn");

    const W = canvas.width;
    const H = canvas.height;

    // ===== 画像・音 =====
    const womanImg = document.getElementById("womanImg");

    const cleanerImg = new Image();
    cleanerImg.src = "cleaner.png";

    const cleanSound = new Audio("clean.mp3");
    cleanSound.volume = 0.6;

    // ===== プレイヤー =====
    const player = {
      x: W / 2,
      y: H / 2,
      w: 0,
      h: 0,
      speed: 4
    };

    cleanerImg.onload = () => {
      const scale = 0.15;
      player.w = cleanerImg.width * scale;
      player.h = cleanerImg.height * scale;
    };

    // ===== ゴミ =====
    const TRASH_COUNT = 6;
    let trash = [];

    // ===== 障害物 =====
    const obstacles = [
      { x: 60, y: 120, w: 80, h: 20 },
      { x: 200, y: 200, w: 100, h: 20 },
      { x: 100, y: 380, w: 160, h: 20 }
    ];

    // ===== 状態 =====
    let dragging = false;
    let targetX = player.x;
    let targetY = player.y;
    let cleared = false;

    // ===== 初期化 =====
    function resetGame() {
      trash = [];
      for (let i = 0; i < TRASH_COUNT; i++) {
        trash.push({
          x: Math.random() * (W - 20) + 10,
          y: Math.random() * (H - 20) + 10,
          r: 8,
          alive: true
        });
      }

      cleared = false;
      womanImg.src = "lady1.png";
      msg.textContent = "ゴミを全部吸い取ろう！";
    }

    resetGame();

    // ===== 入力（タッチ・マウス） =====
    function setTarget(e) {
      const rect = canvas.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

      targetX = x * (W / rect.width);
      targetY = y * (H / rect.height);
    }

    canvas.addEventListener("mousedown", e => {
      dragging = true;
      setTarget(e);
    });

    canvas.addEventListener("mousemove", e => {
      if (dragging) setTarget(e);
    });

    window.addEventListener("mouseup", () => dragging = false);

    canvas.addEventListener("touchstart", e => {
      dragging = true;
      setTarget(e);
    }, { passive: false });

    canvas.addEventListener("touchmove", e => {
      setTarget(e);
    }, { passive: false });

    canvas.addEventListener("touchend", () => dragging = false);

    // ===== 当たり判定 =====
    function hitRect(a, b) {
      return (
        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y
      );
    }

    // ===== 更新 =====
    function update() {
      if (!dragging || cleared) return;

      // 移動
      const dx = targetX - (player.x + player.w / 2);
      const dy = targetY - (player.y + player.h / 2);
      const dist = Math.hypot(dx, dy);

      if (dist > 1) {
        const vx = dx / dist * player.speed;
        const vy = dy / dist * player.speed;

        // X方向だけ試す
        let nextX = {
          x: player.x + vx,
          y: player.y,
          w: player.w,
          h: player.h
        };

        // Y方向だけ試す
        let nextY = {
          x: player.x,
          y: player.y + vy,
          w: player.w,
          h: player.h
        };

        let blockX = false;
        let blockY = false;

        for (const o of obstacles) {
          if (hitRect(nextX, o)) {
            console.log("X方向で当たった", nextX, o);
            blockX = true;
          }
          if (hitRect(nextY, o)) {
            console.log("Y方向で当たった", nextY, o);
            blockY = true;
          }
        }

        if (!blockX) player.x += vx;
        if (!blockY) player.y += vy;
      }

      // ゴミ吸い取り
      for (const t of trash) {
        if (!t.alive) continue;

        const dx = (player.x + player.w / 2) - t.x;
        const dy = (player.y + player.h / 2) - t.y;
        const d = Math.hypot(dx, dy);

        if (d < 30) {
          t.alive = false;
          cleanSound.currentTime = 0;
          cleanSound.play();
        }
      }

      // クリア判定
      if (trash.every(t => !t.alive)) {
        cleared = true;
        showClearModal();
      }
    }

    function showClearModal() {
      womanImg.src = "lady2.png";
      modal.classList.add("show");
    }

    restartBtn.addEventListener("click", () => {
      modal.classList.remove("show");
      resetGame();
    });

    // ===== 描画 =====
    function draw() {
      ctx.clearRect(0, 0, W, H);

      // 障害物
      ctx.fillStyle = "#ccc";
      for (const o of obstacles) {
        ctx.fillRect(o.x, o.y, o.w, o.h);
      }

      // ゴミ
      for (const t of trash) {
        if (!t.alive) continue;
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
        ctx.fillStyle = "#001933";
        ctx.fill();
      }

      // プレイヤー
      ctx.drawImage(cleanerImg, player.x, player.y, player.w, player.h);
    }

    // ===== ループ =====
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>

</body>

</html>
