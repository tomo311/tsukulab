<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>魚が泳ぐゲーム</title>

  <style>
    body {
      margin: 0;
      background: #cceeff;
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    canvas {
      background: linear-gradient(#3b9ef6, #378ab1);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    .hint {
      position: fixed;
      bottom: 16px;
      width: 100%;
      text-align: center;
      font-size: 14px;
      color: #333;
    }
    .game-wrap {
      display: flex;
      align-items: center;       /* 縦中央 */
      justify-content: center;   /* 全体中央 */
      gap: 12px;
    }

    .side {
      width: 60px;               /* 好きなサイズ */
      opacity: 0.9;
    }

    .side.left {
      transform: scaleX(-1);     /* 左右反転（向かい合わせ） */
    }

    @media (max-width: 600px) {
      .side {
        display: none;
      }
    }

  </style>
</head>

<body>

  <div class="game-wrap">
    <img src="mold.png" class="side left" alt="">
    <canvas id="game" width="360" height="540"></canvas>
    <div class="hint">SPACE / タップで浮上</div>
    <img src="mold.png" class="side right" alt="">
  </div>


  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const W = canvas.width;
    const H = canvas.height;

    // ===== 画像・音 =====
    const fishImg = new Image();
    fishImg.src = "fish.png";

    const swimSound = new Audio("swim.mp3");
    swimSound.volume = 0.6;

    // ===== 魚 =====
    const fish = {
      x: 80,
      y: H / 2,
      w: 48,
      h: 48,
      vy: 0
    };

    // ===== 重力 =====
    const GRAVITY = 0.2;
    const LIFT = -6;

    // ===== 壁 =====
    const pipes = [];
    const PIPE_W = 60;
    const GAP = 180;
    let frame = 0;
    let speed = 2;

    // ===== ゲーム状態 =====
    let running = false;
    let score = 0;

    // ===== 入力 =====
    function lift() {
      if (!running) {
        startGame();
        return;
      }
      fish.vy = LIFT;
      swimSound.currentTime = 0;
      swimSound.play();
    }

    window.addEventListener("keydown", e => {
      if (e.code === "Space") lift();
    });

    canvas.addEventListener("click", lift);
    canvas.addEventListener("touchstart", lift);

    // ===== ゲーム開始 =====
    function startGame() {
      running = true;
      fish.y = H / 2;
      fish.vy = 0;
      pipes.length = 0;
      frame = 0;
      score = 0;
    }

    // ===== 壁生成 =====
    function spawnPipe() {
      const topH = Math.random() * (H - GAP - 100) + 40;
      pipes.push({
        x: W,
        top: topH,
        bottom: topH + GAP,
        passed: false
      });
    }

    // ===== 当たり判定 =====
    function hitPipe(p) {
      return (
        fish.x + fish.w > p.x &&
        fish.x < p.x + PIPE_W &&
        (fish.y < p.top || fish.y + fish.h > p.bottom)
      );
    }

    // ===== 更新 =====
    function update() {
      if (!running) return;

      // 重力
      fish.vy += GRAVITY;
      fish.y += fish.vy;

      // 壁
      if (frame % 120 === 0) spawnPipe();

      for (const p of pipes) {
        p.x -= speed;

        if (!p.passed && p.x + PIPE_W < fish.x) {
          p.passed = true;
          score++;
        }

        if (hitPipe(p)) gameOver();
      }

      // 画面外
      if (fish.y < 0 || fish.y + fish.h > H) {
        gameOver();
      }

      // 難易度アップ
      frame++;
      speed = 2 + frame / 1800;
    }

    // ===== 描画 =====
    function draw() {
      ctx.clearRect(0, 0, W, H);

      // 壁
      ctx.fillStyle = "#777";
      for (const p of pipes) {
        ctx.fillRect(p.x, 0, PIPE_W, p.top);
        ctx.fillRect(p.x, p.bottom, PIPE_W, H);
      }

      // 魚
      ctx.drawImage(fishImg, fish.x, fish.y, fish.w, fish.h);

      // スコア
      ctx.fillStyle = "#000";
      ctx.font = "20px system-ui";
      ctx.fillText(score, W / 2 - 6, 30);

      if (!running) {
        ctx.font = "bold 24px system-ui";
        ctx.fillText("タップして始める", 70, H / 2);
      }
    }

    // ===== ゲームオーバー =====
    function gameOver() {
      running = false;
    }

    // ===== ループ =====
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>

</body>

</html>
