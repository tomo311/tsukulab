<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>もぐらたたき</title>
  <style>
    body { font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; margin: 16px; }
    .row { display:flex; gap:10px; flex-wrap: wrap; align-items:center; margin-bottom: 10px; }
    button { padding: 8px 12px; border-radius: 10px; border: 1px solid #bbb; background:#fff; cursor:pointer; }
    button:hover { background:#f5f5f5; }
    .hud { font-weight: 700; }
    canvas { border: 1px solid #aaa; border-radius: 10px; background:#fff; display:block; touch-action: manipulation; }
    .note { 
      color:#555; font-size: 14px; margin-top: 8px; 
    }
    .container {
      display: flex;
      flex-direction: column;   /* 縦並び */
      align-items: center;      /* 横中央 */
      gap: 10px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-content {
      background: #fff;
      padding: 20px 24px;
      border-radius: 14px;
      width: min(90%, 320px);
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .modal-buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 16px;
    }

  </style>
</head>
<body>
  <div class="container">
    <h2>もぐらたたき</h2>

    <div class="row">
      <button id="start">スタート</button>
      <button id="reset">リセット</button>
      <span class="hud" id="hud"></span>
    </div>

    <canvas id="cv" width="600" height="520"></canvas>
    <div class="note">もぐらをたたけ！ 制限時間20秒</div>
  </div>

  <div id="modal" class="modal" style="display:none;">
    <div class="modal-content">
      <h3>結果</h3>
      <p id="modalScore"></p>
  
      <div class="modal-buttons">
        <button id="modalRestart">もう一回</button>
        <button id="modalClose">とじる</button>
      </div>
    </div>
  </div>

  <script>
  (() => {
    const canvas = document.getElementById("cv");
    const ctx = canvas.getContext("2d");
    const hud = document.getElementById("hud");
    const startBtn = document.getElementById("start");
    const resetBtn = document.getElementById("reset");
    const modal = document.getElementById("modal");
    const modalScore = document.getElementById("modalScore");
    const modalRestart = document.getElementById("modalRestart");
    const modalClose = document.getElementById("modalClose");

    const W = canvas.width;
    const H = canvas.height;

    let moleImageLoaded = false;
    const moleImage = new Image();
    moleImage.src = "mole.png";

    moleImage.onload = () => {
      moleImageLoaded = true;
    };

    const hitSound = new Audio("hit.mp3");
    hitSound.volume = 0.6;

    // ゲーム設定
    const GAME_SECONDS = 20;

    // 穴の配置（3x3）
    const holes = [];
    const grid = { rows: 3, cols: 3 };
    const padding = 70;
    const gapX = (W - padding*2) / (grid.cols - 1);
    const gapY = (H - padding*2) / (grid.rows - 1);

    for (let r=0; r<grid.rows; r++) {
      for (let c=0; c<grid.cols; c++) {
        holes.push({
          x: padding + c*gapX,
          y: padding + r*gapY + 30, // 少し下げる
          radius: 40
        });
      }
    }

    // 状態
    let running = false;
    let score = 0;
    let startTime = null;

    // もぐら状態
    let mole = {
      holeIndex: -1,
      visible: false,
      showUntil: 0
    };

    // ランダム
    function randInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }

    function remainingSeconds() {
      if (!running) return GAME_SECONDS;
      const elapsed = (performance.now() - startTime) / 1000;
      return Math.max(0, Math.ceil(GAME_SECONDS - elapsed));
    }

    function updateHUD(msg="") {
      const t = remainingSeconds();
      hud.textContent = `たたいた数: ${score}   のこり: ${t}秒`;
    }

    function startGame() {
      if (running) return;
      running = true;
      score = 0;
      startTime = performance.now();
      mole.visible = false;
      mole.holeIndex = -1;
      updateHUD("");
    }

    function resetGame() {
      running = false;
      score = 0;
      startTime = null;
      mole.visible = false;
      mole.holeIndex = -1;
      updateHUD("SPACE/スタートで開始");
      draw();
    }

    // もぐらを出す
    function spawnMole() {
      // 前と同じ穴になりにくくする
      let idx = randInt(0, holes.length - 1);
      if (idx === mole.holeIndex) idx = (idx + randInt(1, holes.length-1)) % holes.length;

      mole.holeIndex = idx;
      mole.visible = true;

      // 表示時間：短め〜長めをランダム
      const now = performance.now();
      const duration = randInt(800, 1200); // ms
      mole.showUntil = now + duration;
    }

    function endGame() {
      running = false;
      mole.visible = false;
      
      modalScore.textContent = `スコア：${score} 回`;
      modal.style.display = "flex";
    }

    // 当たり判定（クリック位置が丸の中か）
    function hitMole(mx,my) {
      if (!mole.visible || mole.holeIndex < 0) return false;
      const h = holes[mole.holeIndex];
      const dx = mx - h.x;
      const dy = my - h.y;
      return (dx*dx + dy*dy) <= (h.radius*h.radius);
    }

    // 座標変換
    function getMousePos(e) {
      const rect = canvas.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
      // CSS拡大縮小を考慮
      return {
        x: x * (canvas.width / rect.width),
        y: y * (canvas.height / rect.height)
      };
    }

    // 更新
    function step() {
      if (!running) return;

      // 終了判定
      const elapsed = (performance.now() - startTime) / 1000;
      if (elapsed >= GAME_SECONDS) {
        endGame();
        return;
      }

      const now = performance.now();

      // もぐらがいない or 時間切れなら次を出す
      if (!mole.visible || now >= mole.showUntil) {
        spawnMole();
      }

      updateHUD("");
    }

    // 描画
    function draw() {
      ctx.clearRect(0,0,W,H);

      // 背景の薄いドット
      ctx.globalAlpha = 0.08;
      ctx.beginPath();
      for (let y=0; y<H; y+=24) {
        for (let x=0; x<W; x+=24) ctx.rect(x,y,2,2);
      }
      ctx.fillStyle = "#000";
      ctx.fill();
      ctx.globalAlpha = 1;

      // タイトル
      ctx.fillStyle = "#111";
      ctx.font = "16px system-ui";
      ctx.fillText("もぐらをたたけ！", 14, 22);

      // 穴（円）
      for (const h of holes) {
        ctx.beginPath();
        ctx.arc(h.x, h.y, h.radius, 0, Math.PI*2);
        ctx.fillStyle = "#ddd";
        ctx.fill();
        ctx.strokeStyle = "#999";
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      // もぐら（PNG）
      if (mole.visible && mole.holeIndex >= 0) {
        const h = holes[mole.holeIndex]

        const size = h.radius * 1.6; // 大きさ調整
        const x = h.x - size / 2;
        const y = h.y - size / 2;

        if (moleImageLoaded) {
          ctx.drawImage(moleImage, x, y, size, size);
        } else {
          // 読み込み中の保険（四角）
          ctx.fillStyle = "#0b66ff";
          ctx.fillRect(x, y, size, size);
        }
      }

      // スタート案内
      if (!running) {
        ctx.fillStyle = "#111";
        ctx.font = "bold 26px system-ui";
        const msg = startTime ? "終了！" : "START!";
        ctx.fillText(msg, W/2 - ctx.measureText(msg).width/2, H - 24);

        ctx.font = "16px system-ui";
        const msg2 = "スタートを押してね";
        ctx.fillText(msg2, W/2 - ctx.measureText(msg2).width/2, H - 4);
      }
    }

    function loop() {
      step();
      draw();
      requestAnimationFrame(loop);
    }

    // クリック・タップ
    function onTap(e) {
      const {x, y} = getMousePos(e);
      if (!running) return;

      if (hitMole(x, y)) {
        score += 1;

      // ★ 効果音を鳴らす
      hitSound.currentTime = 0; // 連続ヒット対策
      hitSound.play();

        // ヒットしたらすぐ消して次へ
        mole.visible = false;
      } else {
        // 外したら軽いペナルティ（お好み）
        score = Math.max(0, score - 0);
      }
      updateHUD("");
    }

    canvas.addEventListener("click", onTap);
    canvas.addEventListener("touchstart", onTap, {passive:true});

    startBtn.addEventListener("click", () => {
      startGame();
    });

    resetBtn.addEventListener("click", resetGame);

    modalRestart.addEventListener("click", () => {
      modal.style.display = "none";
      startGame();
    });

    modalClose.addEventListener("click", () => {
      modal.style.display = "none";
    });

    // 初期表示
    resetGame();
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
