<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>「つくラボ」で作れるゲーム</title>

  <link rel="stylesheet" href="../style.css">
</head>
<body>

<section class="hero">
  <div class="hero-inner">
    <a href="../index.html">
      <img src="../images/logo.png" alt="つくラボ ロゴ" class="hero-logo">
    </a>

    <h1 class="text-center">「つくラボ」で作れるゲーム</h1>
    <p class="text-center note margin-bottom">
      気になるゲームを遊んでみよう！
    </p>
  </div>
</section>


<section>

  <div class="works">

    <div class="work demo-card">
      <a class="demo-link" href="./break_out/">
        <div class="demo-thumb">
          <picture>
            <source srcset="../images/demo_break_out.webp" type="image/webp">
            <img src="../images/demo_break_out.png" loading="lazy">
          </picture>
        </div>
        <h3>ブロック崩し</h3>
      </a>
    </div>

    <div class="work demo-card">
      <a class="demo-link" href="./flappybird/">
        <div class="demo-thumb">
          <picture>
            <source srcset="../images/demo_flappy_bird.webp" type="image/webp">
            <img src="../images/demo_flappy_bird.png" loading="lazy">
          </picture>
        </div>
        <h3>鳥を飛ばすゲーム</h3>
      </a>
    </div>

    <div class="work demo-card">
      <a class="demo-link" href="./cat_search/">
        <div class="demo-thumb">
          <picture>
            <source srcset="../images/demo_cat_search.webp" type="image/webp">
            <img src="../images/demo_cat_search.png" loading="lazy">
          </picture>
        </div>
        <h3>猫を探すゲーム</h3>
      </a>
    </div>

    <div class="work demo-card">
      <a class="demo-link" href="./whack_a_mole/">
        <div class="demo-thumb">
          <picture>
            <source srcset="../images/demo_whack_a_mole.webp" type="image/webp">
            <img src="../images/demo_whack_a_mole.png" loading="lazy">
          </picture>
        </div>
        <h3>もぐらたたき</h3>
      </a>
    </div>

    <div class="work demo-card">
      <a class="demo-link" href="./race_game/">
        <div class="demo-thumb">
          <picture>
            <source srcset="../images/demo_race_game.webp" type="image/webp">
            <img src="../images/demo_race_game.png" loading="lazy">
          </picture>
        </div>
        <h3>レースゲーム</h3>
      </a>
    </div>

    <div class="work demo-card">
      <a class="demo-link" href="./water_plant/">
        <div class="demo-thumb">
          <picture>
            <source srcset="../images/demo_water_plant.webp" type="image/webp">
            <img src="../images/demo_water_plant.png" loading="lazy">
          </picture>
        </div>
        <h3>水をあげるゲーム</h3>
      </a>
    </div>

    <div class="work demo-card">
      <a class="demo-link" href="./float_fish">
        <div class="demo-thumb">
          <picture>
            <source srcset="../images/demo_float_fish.webp" type="image/webp">
            <img src="../images/demo_float_fish.png" loading="lazy">
          </picture>
        </div>
        <h3>魚が泳ぐゲーム</h3>
      </a>
    </div>

  </div>
</section>

<div class="text-center margin-bottom">
  <a href="/" class="btn">← トップに戻る</a>
</div>

<footer>
  ©つくラボ
</footer>

</body>
</html>
